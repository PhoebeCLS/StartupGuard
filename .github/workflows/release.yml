name: Build, Screenshot & Signed Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional exact version (e.g. v1.0.1) or bump rule (auto | patch | minor | major)'
        required: false
        default: 'auto'

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_FORCE_NODE24: 'true'

jobs:
  test-and-release:
    runs-on: windows-latest
    # Prevent infinite loops on automated screenshot commits ([skip ci] / [skip release])
    if: |
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution (Release x64)
        shell: pwsh
        run: |
          dotnet build StartupGuard.slnx -c Release -p:Platform=x64 --nologo

      - name: Run full test suite (Release x64)
        shell: pwsh
        run: |
          dotnet test tests/StartupGuard.Tests/StartupGuard.Tests.csproj -c Release -p:Platform=x64 --nologo

      - name: Ensure Inno Setup 6.4+ is available
        shell: pwsh
        run: |
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $needsInstall = $true
          if ($iscc) {
            $ver = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($iscc).ProductVersion
            Write-Host "Found preinstalled Inno Setup version: $ver"
            $parsedVer = $null
            if ([version]::TryParse(($ver -replace '[^0-9.].*$', ''), [ref]$parsedVer) -and $parsedVer -ge [version]'6.4.0') {
              $needsInstall = $false
            }
          }
          if ($needsInstall) {
            $innoUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
            $expectedSha = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
            $innoSetup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
            Invoke-WebRequest -Uri $innoUrl -OutFile $innoSetup
            $actualSha = (Get-FileHash $innoSetup -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha -ne $expectedSha) {
              throw "Inno Setup SHA256 mismatch: $actualSha"
            }
            $proc = Start-Process -FilePath $innoSetup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "Inno Setup installer exited with $($proc.ExitCode)"
            }
          }

      - name: Determine release version & generate changelog
        id: meta
        shell: pwsh
        run: |
          $latestTag = (git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | Select-Object -First 1)
          $override = "${{ github.event.inputs.version_override }}".Trim()

          if (-not $latestTag) {
            $newVersion = if ($override -and $override -ne 'auto' -and $override -notin @('patch','minor','major')) { $override.TrimStart('v') } else { '1.0.0' }
            $commitRange = "HEAD"
          }
          else {
            $base = $latestTag.TrimStart('v')
            $nums = $base.Split('.')
            $maj = [int]$nums[0]; $min = [int]$nums[1]; $pat = [int]$nums[2]
            $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
            [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
            $commitRange = "$latestTag..HEAD"
            $msgs = @(git -c i18n.logOutputEncoding=utf-8 log $commitRange --format="%s%n%b") -join "`n"

            if ($override -and $override -ne 'auto' -and $override -notin @('patch','minor','major')) {
              $newVersion = $override.TrimStart('v')
            }
            elseif ($override -eq 'major' -or $msgs -match 'BREAKING CHANGE|\[release major\]|^\w+!:') {
              $maj++; $min = 0; $pat = 0
              $newVersion = "$maj.$min.$pat"
            }
            elseif ($override -eq 'minor' -or $msgs -match '(?m)^feat(\([^)]+\))?:|\[release minor\]') {
              $min++; $pat = 0
              $newVersion = "$maj.$min.$pat"
            }
            else {
              $pat++
              $newVersion = "$maj.$min.$pat"
            }
          }

          $newTag = "v$newVersion"
          "APP_VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$newTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PREV_TAG=$latestTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Resolved release version: $newTag (previous: $latestTag)"

      - name: Build release artifacts, WinGet manifests & capture screenshots
        shell: pwsh
        run: |
          ./scripts/build_release.ps1 -Version "${{ env.APP_VERSION }}"
          ./scripts/capture_screenshots.ps1 -AppExe "artifacts/publish/win-x64-self-contained/StartupGuard.App.exe" -AssetsDir "assets"
          $wingetDir = "packaging/winget/manifests/p/PhoebeCLS/StartupGuard/${{ env.APP_VERSION }}"
          ./scripts/New-WingetManifest.ps1 -Version "${{ env.APP_VERSION }}" -DistDir "dist" -OutputDirectory $wingetDir | Out-Null
          if (Get-Command winget.exe -ErrorAction SilentlyContinue) {
            winget validate --manifest $wingetDir --disable-interactivity
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335192) {
              throw "winget validate failed with code $LASTEXITCODE"
            }
          }

      - name: Configure SSH Commit & Tag Signing Key (Ephemeral)
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw "Missing repository secret RELEASE_SSH_SIGNING_KEY. Cannot create Verified signed tag/commit."
          }

          $keyPath = Join-Path $env:RUNNER_TEMP "ci_signing_key"
          $normKey = ($env:SIGNING_KEY -replace "`r`n", "`n").TrimEnd("`r", "`n") + "`n"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($keyPath, $normKey, $utf8NoBom)

          # Ensure strict permissions where applicable
          icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null

          git config user.name "PhoebeCLS"
          git config user.email "78586509+PhoebeCLS@users.noreply.github.com"
          git config gpg.format ssh
          git config user.signingkey $keyPath
          if (Test-Path "C:\Program Files\Git\usr\bin\ssh-keygen.exe") {
            git config gpg.ssh.program "C:/Program Files/Git/usr/bin/ssh-keygen.exe"
          }
          git config commit.gpgsign true
          git config tag.gpgsign true

      - name: Commit updated screenshots & WinGet manifests (SSH Verified) if changed
        shell: pwsh
        run: |
          git add assets/*.jpg packaging/winget/
          $changed = git status --porcelain assets/ packaging/winget/
          if ($changed) {
            git commit -S -m "chore(release): update screenshots and winget manifests for ${{ env.RELEASE_TAG }} [skip ci]"
            git push origin HEAD:main
          }
          else {
            Write-Host "UI screenshots and WinGet manifests unchanged, keeping signed HEAD commit."
          }

      - name: Create SSH-Signed Tag and Auto Changelog Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          git config core.quotepath false

          $tag = "${{ env.RELEASE_TAG }}"
          $ver = "${{ env.APP_VERSION }}"
          $prev = "${{ env.PREV_TAG }}"

          # Create signed annotated tag pointing to current signed HEAD (guarantees both Tag & Commit Verified badges)
          git tag -s "$tag" -m "Release $tag"
          git push origin "$tag"

          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $rawCommits = @(git -c i18n.logOutputEncoding=utf-8 log $range --no-merges --format="%h|%s")
          $featList = New-Object System.Collections.Generic.List[string]
          $fixList  = New-Object System.Collections.Generic.List[string]
          $perfUi   = New-Object System.Collections.Generic.List[string]
          $other    = New-Object System.Collections.Generic.List[string]

          $scopeLabels = @{
            'core'      = '核心引擎'
            'app'       = '主界面'
            'ui'        = '界面交互'
            'service'   = '后台服务'
            'tray'      = '托盘守护'
            'probe'     = '沙箱探测'
            'installer' = '安装包'
            'ci'        = '自动构建'
            'tests'     = '测试套件'
            'test'      = '测试套件'
            'docs'      = '文档说明'
            'release'   = '发版流程'
            'assets'    = '界面预览'
          }

          $bt = [char]96
          foreach ($line in $rawCommits) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $seg = $line.Split('|', 2)
            $sha = $seg[0].Trim()
            $msg = $seg[1].Trim()
            if ($msg -match '\[skip ci\]|\[skip release\]') { continue }

            $kind = ''
            $scopePrefix = ''
            $desc = $msg
            if ($msg -match '^(feat|fix|perf|ui|style|refactor|chore|docs|test|tests|build|ci)(?:\(([^)]+)\))?:\s*(.+)$') {
              $kind = $Matches[1].ToLowerInvariant()
              $rawScope = if ($Matches[2]) { $Matches[2].Trim().ToLowerInvariant() } else { '' }
              if ($rawScope) {
                $mappedScope = if ($scopeLabels.ContainsKey($rawScope)) { $scopeLabels[$rawScope] } else { $rawScope }
                $scopePrefix = "【$mappedScope】"
              }
              $desc = $Matches[3].Trim()
            }

            $entry = "- $scopePrefix$desc ($bt$sha$bt)"
            if ($kind -eq 'feat') { $featList.Add($entry) }
            elseif ($kind -eq 'fix') { $fixList.Add($entry) }
            elseif ($kind -in @('perf', 'ui', 'style', 'refactor')) { $perfUi.Add($entry) }
            else { $other.Add($entry) }
          }

          if (($featList.Count + $fixList.Count + $perfUi.Count + $other.Count) -eq 0) {
            $other.Add("- 例行构建与发行包打包更新")
          }

          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine("## StartupGuard $tag 更新日志")
          [void]$sb.AppendLine()

          $isInitialRelease = [string]::IsNullOrWhiteSpace($prev)

          if (-not $isInitialRelease -and $featList.Count -gt 0) {
            [void]$sb.AppendLine("### ✨ 新增特性")
            foreach ($i in $featList) { [void]$sb.AppendLine($i) }
            [void]$sb.AppendLine()
          }
          if ($fixList.Count -gt 0) {
            [void]$sb.AppendLine("### 🐛 问题修复")
            foreach ($i in $fixList) { [void]$sb.AppendLine($i) }
            [void]$sb.AppendLine()
          }
          if ($perfUi.Count -gt 0) {
            [void]$sb.AppendLine("### 🎨 界面与性能优化")
            foreach ($i in $perfUi) { [void]$sb.AppendLine($i) }
            [void]$sb.AppendLine()
          }
          if ($other.Count -gt 0) {
            [void]$sb.AppendLine("### 📦 其他变更")
            foreach ($i in $other) { [void]$sb.AppendLine($i) }
            [void]$sb.AppendLine()
          }

          [void]$sb.AppendLine("---")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("## 📥 下载版本说明（Windows 10/11 x64 & ARM64）")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("> 仅提供 Windows 10/11 64 位（`x64` / `arm64`）版本（ETW 内核会话不兼容 32 位 x86）。`framework-dependent` 安装版支持自动检测并安装 [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)；安装版默认在卸载时清除全部个人数据及 `C:\ProgramData\StartupGuard` 目录，可在卸载确认框取消勾选保留规则与日志。WinGet 包清单位于仓库 `packaging/winget/manifests/p/PhoebeCLS/StartupGuard/$ver`。")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("| 类型 | $($bt)self-contained$($bt)（免装运行库，推荐） | $($bt)framework-dependent$($bt)（体积小，需 .NET 10 桌面运行时） |")
          [void]$sb.AppendLine("| :--- | :--- | :--- |")
          [void]$sb.AppendLine("| **x64 安装版** | $($bt)StartupGuard-$ver-x64-self-contained-Setup.exe$($bt) | $($bt)StartupGuard-$ver-x64-framework-dependent-Setup.exe$($bt) |")
          [void]$sb.AppendLine("| **x64 便携包** | $($bt)StartupGuard-$ver-x64-self-contained-portable.zip$($bt) | $($bt)StartupGuard-$ver-x64-framework-dependent-portable.zip$($bt) |")
          [void]$sb.AppendLine("| **ARM64 安装版** | $($bt)StartupGuard-$ver-arm64-self-contained-Setup.exe$($bt) | $($bt)StartupGuard-$ver-arm64-framework-dependent-Setup.exe$($bt) |")
          [void]$sb.AppendLine("| **ARM64 便携包** | $($bt)StartupGuard-$ver-arm64-self-contained-portable.zip$($bt) | $($bt)StartupGuard-$ver-arm64-framework-dependent-portable.zip$($bt) |")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("### 🔐 SHA256")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("| File | SHA256 |")
          [void]$sb.AppendLine("| :--- | :--- |")
          foreach ($line in (Get-Content "dist/SHA256SUMS.txt" -Encoding UTF8)) {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
              [void]$sb.AppendLine("| $($Matches[2].Trim()) | $($Matches[1].ToLowerInvariant()) |")
            }
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release_notes.md"
          [System.IO.File]::WriteAllText($notesPath, $sb.ToString(), (New-Object System.Text.UTF8Encoding($false)))

          $assetFiles = @(
            Get-ChildItem "dist" -File |
              Where-Object { $_.Name -like "StartupGuard-$ver-*.exe" -or $_.Name -like "StartupGuard-$ver-*.zip" } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assetFiles.Count -ne 8) {
            throw "Expected 8 release assets in dist/ for v$ver, found $($assetFiles.Count): $($assetFiles -join ', ')"
          }

          gh release create "$tag" `
            --verify-tag `
            --title "StartupGuard $tag" `
            --notes-file "$notesPath" `
            @assetFiles

      - name: Purge temporary SSH signing key from runner
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "ci_signing_key"
          if (Test-Path $keyPath) {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }
